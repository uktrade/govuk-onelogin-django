# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: GOV.UK One Login Django CI
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  code_hygiene:
    name: code_hygiene
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Install a specific version of uv.
          version: "0.12.9"
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run ruff check
        run: uv run ruff check

      - name: Run ruff format
        run: uv run ruff format --check

      - name: Run static type checker
        run: uv run ty check

  test:
    name: continuous-integration
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [ 3.11, 3.12, 3.13, 3.14 ]

    steps:
      - uses: actions/checkout@v6
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v7
        with:
          # Install a specific version of uv (match local).
          version: "0.12.9"
          # Install with matrix python version
          python-version: ${{ matrix.python-version }}
          # Enable caching
          enable-cache: true
          # Invalidate cache when the lock file changes
          cache-dependency-glob: "uv.lock"

      - name: Install the project dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest

      - name: Check coverage
        run: |
          uv run coverage run --source=govuk_onelogin_django -m pytest
          uv run coverage report --fail-under=96
